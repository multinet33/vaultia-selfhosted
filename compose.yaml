# Vaultia auto-hébergé — PRÉ-VERSION (bêta, avant 1.0).
#
#     cp .env.example .env        # puis renseigner les valeurs OBLIGATOIRES
#     docker compose up -d
#
# Deux services : PostgreSQL et Vaultia (image publiée sur GHCR, jamais construite ici).
# Trois volumes persistants : base, fichiers, modèles de la vision locale (docs/storage.md).
# PostgreSQL n'est joignable que depuis le réseau interne ; Vaultia est publié sur la boucle
# locale de l'hôte par défaut. Accès depuis le réseau : reverse proxy HTTPS (docs/reverse-proxy.md),
# ou HTTP sur l'adresse privée du serveur, réseau local seulement (docs/configuration.md).
name: vaultia

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vaultia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env (voir .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-vaultia}
      # Encodage UTF-8 et tri neutre, quel que soit le système hôte.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      # PostgreSQL 18 : le volume se monte sur /var/lib/postgresql (sous-dossier par version majeure).
      - postgres-data:/var/lib/postgresql
    networks:
      - vaultia
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 60s

  vaultia:
    # Image candidate épinglée par son empreinte (digest) : l'image lancée est exactement celle du
    # code source indiqué dans docs/update.md, même si le tag était déplacé. Une mise à jour est un
    # changement de cette ligne (git pull de ce dépôt), jamais un « latest » implicite.
    # 0.1.0-rc.26 : source Vaultia 89861677f1265aee649513777cc15110a8e5a955 (linux/amd64, linux/arm64).
    image: ${VAULTIA_IMAGE:-ghcr.io/multinet33/vaultia:0.1.0-rc.26@sha256:3a045b3b31339aa2585dc11773714335f83c82229666f4e9bfc585ae800c06bd}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vaultia}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vaultia}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET manquant dans .env (voir .env.example)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL manquant dans .env (voir .env.example)}
      VAULTIA_SIGNUP_POLICY: ${VAULTIA_SIGNUP_POLICY:-first-user}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-}
      NOTIFICATIONS_CRON_SECRET: ${NOTIFICATIONS_CRON_SECRET:-}
      MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-}
      # Moteurs installés (liste de l'image) : tous locaux, sauf open-facts (Internet), appelé
      # seulement pour un Espace en mode « externe », jamais en mode local. Installé n'est pas
      # autorisé : chaque Espace reste « désactivé » tant que son administrateur ne choisit pas.
      INTELLIGENCE_PROVIDERS: ${INTELLIGENCE_PROVIDERS:-zxing-barcode,tesseract-ocr,siglip2-vision,e5-embeddings,document-rules,open-facts}
      INTELLIGENCE_MODELS_PROVISION: ${INTELLIGENCE_MODELS_PROVISION:-auto}
      INTELLIGENCE_CONTACT: ${INTELLIGENCE_CONTACT:-}
      DOCUMENT_INDEXER: ${DOCUMENT_INDEXER:-}
      TESSERACT_LANGS: ${TESSERACT_LANGS:-}
      WEBHOOK_ALLOW_PRIVATE_NETWORKS: ${WEBHOOK_ALLOW_PRIVATE_NETWORKS:-}
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY:-}
      # Recherche Web de codes produit (facultative) : vides, Vaultia fonctionne comme avant.
      WEB_PRODUCT_SEARCH_BACKEND: ${WEB_PRODUCT_SEARCH_BACKEND:-}
      WEB_PRODUCT_SEARCH_URL: ${WEB_PRODUCT_SEARCH_URL:-}
      WEB_PRODUCT_SEARCH_API_KEY: ${WEB_PRODUCT_SEARCH_API_KEY:-}
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID:-}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET:-}
      EBAY_MARKETPLACE: ${EBAY_MARKETPLACE:-}
    volumes:
      - media:/var/lib/vaultia/media
      - models:/var/lib/vaultia/models
    ports:
      # Boucle locale par défaut. Accès depuis le réseau : reverse proxy HTTPS, ou l'adresse IPv4
      # privée du serveur en HTTP (réseau local seulement, docs/configuration.md).
      - "${VAULTIA_BIND_ADDRESS:-127.0.0.1}:${VAULTIA_PORT:-3000}:3000"
    networks:
      - vaultia
    # Laisse aux requêtes en cours le temps de se terminer (SIGTERM, puis SIGKILL).
    stop_grace_period: 30s
    # Watchtower (facultatif, sans effet seul) : désigne ce seul conteneur à un Watchtower externe
    # lancé avec --label-enable --scope vaultia. PostgreSQL n'est volontairement pas étiqueté.
    # Image épinglée par défaut : rien ne bouge. Seul VAULTIA_IMAGE=…:rc ou …:stable suit un canal.
    # Détail et risques (migrations, sauvegardes) : docs/update.md.
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=vaultia"

  # Recherche Web de codes produit (facultative, docs/web-product-search.md) : SearXNG, démarré
  # seulement avec le profil `web-search` (COMPOSE_PROFILES=web-search, aussi comme variable de pile
  # Portainer). Aucun port publié : joignable par Vaultia seul, sur le réseau interne, à une adresse
  # FIXE — Vaultia (depuis 0.1.0-rc.7) n'accepte une URL http que vers une IPv4 privée (jamais un nom d'hôte),
  # d'où WEB_PRODUCT_SEARCH_URL=http://172.30.83.11:8080. Image officielle, version et empreinte figées.
  searxng:
    image: searxng/searxng:2026.9.25-12f8b6515@sha256:5286edb35782454ab8a102c5eff6b54bff745853191b46aeead95f225aa6dfb6
    profiles: ["web-search"]
    restart: unless-stopped
    # Refus explicite sans secret (SearXNG démarrerait sinon avec sa clé par défaut), puis le point
    # d'entrée d'origine de l'image.
    entrypoint:
      - /bin/sh
      - -c
      - '[ -n "$$SEARXNG_SECRET" ] || { echo "[searxng] SEARXNG_SECRET manquant (docs/web-product-search.md)" >&2; exit 1; }; exec /usr/local/searxng/entrypoint.sh'
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
      SEARXNG_BASE_URL: http://${SEARXNG_IPV4_ADDRESS:-172.30.83.11}:8080/
    configs:
      - source: searxng-settings
        target: /etc/searxng/settings.yml
    volumes:
      - searxng-cache:/var/cache/searxng
    networks:
      vaultia:
        ipv4_address: ${SEARXNG_IPV4_ADDRESS:-172.30.83.11}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

configs:
  # Réglages SearXNG (défauts du projet + API JSON, lue par Vaultia ; aucun limiteur : instance
  # privée, sans Valkey). Embarqués ici : une pile Portainer ne peut pas monter ./settings.yml.
  searxng-settings:
    content: |
      use_default_settings: true
      server:
        limiter: false
        public_instance: false
        image_proxy: false
      search:
        formats:
          - html
          - json

volumes:
  postgres-data:
  media:
  models:
  searxng-cache:

networks:
  vaultia:
    ipam:
      config:
        # Sous-réseau fixe : l'adresse d'un proxy dans ce réseau est connue (TRUSTED_PROXIES).
        # À changer seulement s'il entre en conflit avec un réseau existant.
        - subnet: ${VAULTIA_SUBNET:-172.30.83.0/24}
